<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Drill</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400&family=Shippori+Mincho:wght@400&family=Reggae+One&family=Yuji+Boku&family=Zen+Maru+Gothic:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ec; --ink: #211d18; --dim: #8a8276; --line: #dcd5c8; --tint: #ebe5d8; --rowOpen: #dbd2bf;
  --accent: #a4412d; --good: #4d6b4f;
  --en: "EB Garamond", Georgia, serif;
  --ja: "Klee One", "YuKyokasho", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --ink: #e9e3d6; --dim: #80796d; --line: #322e27; --tint: #24211b; --rowOpen: #1b1914;
    --accent: #dc8b70; --good: #93b295;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --ink: #e9e3d6; --dim: #80796d; --line: #322e27; --tint: #24211b; --rowOpen: #1b1914;
  --accent: #dc8b70; --good: #93b295;
}
:root[data-font="mincho"] { --ja: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; }
:root[data-font="gothic"] { --ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
:root[data-font="rounded"] { --ja: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; }
:root[data-font="edomoji"] { --ja: "Reggae One", "Hiragino Mincho ProN", serif; }
:root[data-font="calligraphy"] { --ja: "Yuji Boku", "Hiragino Mincho ProN", serif; }
:root { --fit5: calc((100vw - 32px) / 5); }   /* five full-width characters inside the gutters */
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }   /* no pull-to-refresh mid-swipe */
body {
  background: var(--bg); color: var(--ink);
  font: 400 1.15rem/1.5 var(--en), var(--ja);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;   /* no double-tap zoom, no tap delay */
}
a, button { color: inherit; font: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

header {
  position: fixed; inset: 0 0 auto 0; z-index: 2;
  display: flex; justify-content: space-between; align-items: baseline;
  padding: max(18px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 18px max(24px, env(safe-area-inset-left));
  color: var(--dim); font-size: 1rem;
}
#label { transition: opacity .3s; }
#count { color: var(--ink); text-decoration: none; font-variant-numeric: lining-nums tabular-nums; }
#count.past { color: var(--dim); }
#skipped { color: var(--dim); margin-right: 14px; }
#skipped:empty { display: none; }
/* Progress for the day as one thin bar: this week's stage words, then reviews. */
#hair { position: absolute; left: max(24px, env(safe-area-inset-left)); right: max(24px, env(safe-area-inset-right)); bottom: 8px; display: flex; gap: 3px; pointer-events: none; }
#hair .seg { height: 2px; min-width: 6px; display: flex; background: var(--line); }
#hair .seg > span { background: var(--ink); }
#hair .seg.srs { background: color-mix(in srgb, var(--accent) 28%, var(--bg)); }
#hair .seg.srs > span { background: var(--accent); }
body.zen #hair { opacity: .55; }
/* Swipe strength: while a left swipe is held, how far it has gone picks Hard, Good or Easy. */
#strength {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--footH, 64px) + var(--noteH) + var(--ctl) + 10px); z-index: 3;
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  padding: 10px 18px; background: var(--bg); border-radius: 8px;
}
#strength[hidden] { display: none; }
@keyframes pop { from { transform: scale(1.25); } to { transform: scale(1); } }
#strength .name.pop { animation: pop .18s ease-out; display: inline-block; }
/* The last grade, by the count; going back (or a tap) takes it back to change it. */
#graded { color: var(--dim); font-variant-numeric: lining-nums; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100vw - 140px); }
#graded .w { color: var(--ink); font-family: var(--ja); }
header:has(#graded:not([hidden])) #label { display: none; }   /* the last grade stands in for the label */
#graded[hidden] { display: none; }
#graded .g1 { color: var(--accent); }
#graded .g4 { color: var(--good); }
.haptic { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
#strength .what { display: flex; align-items: baseline; gap: 10px; }
#strength .name { font-size: 1.8rem; }
#strength .name.g4 { color: var(--good); }
#strength .next { color: var(--dim); font-variant-numeric: lining-nums; }
#strength .meter { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 200px; }
#strength .meter span { height: 3px; background: var(--line); }
#strength .meter span.on { background: var(--ink); }
#strength .meter.g4 span.on { background: var(--good); }
#strength .names { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 200px; text-align: center; color: var(--dim); font-size: .85rem; }
/* Recognition cards keep a second row under Got it for hard · easy, so revealing moves nothing. */
main.rec { --ctl: 5.6rem; }
.grades { display: flex; align-items: center; gap: 2px; color: var(--dim); font-size: .9rem; }
.grades .act { border-bottom: 0; padding: 4px 8px; }
.grades .act kbd { margin-left: 4px; }
body.zen .grades .easy, body.zen .grades .dot { display: none; }   /* zen swipes Easy; Hard stays a button */
/* Memory: a word's recall over time, and the stats page. */
.mem { margin-top: 14px; }
.mem .now { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.mem .due { color: var(--accent); }
.mem svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 6px 0 4px; overflow: visible; }
.mem .curve { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.mem .curve.ahead { stroke-dasharray: 3 3; }
.mem .target { stroke: var(--dim); stroke-dasharray: 2 3; }
.mem .nowline { stroke: var(--accent); }
.mem .dot { fill: var(--ink); }
.mem .dot.g1 { fill: var(--accent); }
.mem .dot.seed { fill: none; stroke: var(--dim); }
.mem svg text { fill: var(--dim); font-size: 11px; font-family: var(--en); }
.mem .cards { color: var(--dim); font-size: .95rem; font-variant-numeric: lining-nums; }
.memlink { display: block; margin: -14px 0 22px 12px; color: var(--dim); font-size: .95rem; text-decoration: none; }
.memlink:hover { color: var(--ink); }
.stats { width: min(560px, 100%); margin: 0 auto; padding: 84px 20px 88px; display: flex; flex-direction: column; gap: 30px; }
.stats h2 { font: 400 1.5rem var(--en); margin: 0 0 10px; }
.stats .sub { color: var(--dim); font-size: .95rem; }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 110px; }
.bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; font-size: .8rem; color: var(--dim); font-variant-numeric: lining-nums; }
.bars i { display: block; width: 100%; min-height: 1px; background: var(--line); border-radius: 2px; }
.bars div:first-child { color: var(--ink); }
.bars div:first-child i { background: var(--accent); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; color: var(--dim); font-size: .8rem; margin-top: 4px; }
.days span:first-child { color: var(--accent); }
.loss { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 6em; gap: 8px 10px; align-items: center; margin: 10px 0 6px; font-variant-numeric: lining-nums; }
.loss .track { height: 6px; background: var(--tint); border-radius: 3px; }
.loss .track i { display: block; height: 6px; border-radius: 3px; background: var(--ink); }
.loss .n { color: var(--dim); font-size: .9rem; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
.seg2 button { padding: 10px 0; text-align: center; }
.seg2 button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.seg2 button:disabled { opacity: .4; cursor: default; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.setting .step { display: flex; align-items: center; gap: 4px; font-variant-numeric: lining-nums tabular-nums; }
.setting .step button { width: 40px; height: 40px; color: var(--dim); font-size: 1.2rem; }
.setting .step button:hover { color: var(--ink); }
footer {
  position: fixed; inset: auto 0 0 0; display: flex; justify-content: center; gap: 22px;
  padding: 16px 16px max(16px, env(safe-area-inset-bottom)); color: var(--dim); font-size: .95rem; transition: opacity .3s; flex-wrap: wrap;
}
#syncBtn.err { color: var(--accent); }
#build { align-self: center; font-size: .75em; opacity: .5; font-family: ui-monospace, monospace; }
.touchOnly { display: none; }
footer button:hover { color: var(--ink); }
body.weekList footer { display: none; }
#explain {
  position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 3;
  width: min(640px, calc(100vw - 32px)); max-height: 45vh; overflow-y: auto;
  padding: 14px 18px; background: var(--tint); border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); font-size: 1.05rem; line-height: 1.5; white-space: pre-wrap;
}
#explain .q { font-family: var(--ja); color: var(--dim); margin-bottom: 6px; white-space: normal; }
#explain .q b { color: var(--accent); font-weight: normal; }
#explain .err { color: var(--accent); }

/* Every card has the same four fixed zones, so nothing moves while it changes: the main text,
   the answer, the controls, and a line of notes. The header and navbar are measured (--headH, --footH). */
:root { --ans: 10.5rem; --ctl: 3.25rem; --noteH: 1.9rem; }
main {
  height: 100vh; height: 100dvh;
  display: grid; grid-template-rows: minmax(0, 1fr) var(--ans) var(--ctl) var(--noteH); grid-template-columns: minmax(0, 1fr);
  padding: var(--headH, 64px) max(16px, env(safe-area-inset-right)) var(--footH, 64px) max(16px, env(safe-area-inset-left));
  text-align: center;
}
main > .pane { display: flex; flex-direction: column; align-items: center; justify-content: safe center; overflow-y: auto; min-height: 0; }
main > .answer { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow-y: auto; min-height: 0; padding-top: 14px; }
main > .actions { align-content: center; min-height: 0; }
main > .note { display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 0; }
.hero { font-family: var(--ja); font-weight: 400; line-height: 1.35; font-size: min(clamp(4.1rem, 15.6vw, 9rem), var(--fit5)); overflow-wrap: anywhere; }
.hero:not(.long):not(.en):not(.sentence) { white-space: nowrap; }
.hero.long { font-size: clamp(2.9rem, 9.6vw, 5.8rem); }
.hero.en { font-family: var(--en); font-size: clamp(2.6rem, 7.8vw, 5rem); line-height: 1.2; }
.hero.sentence { font-size: clamp(2rem, 5.5vw, 3.6rem); line-height: 2; max-width: 22em; word-break: auto-phrase; }
/* Wrapped lines of similar length, never one stray character; fitLine prefers a single line. */
.hero, .gloss, .trans, .choice, .done-en, .empty { text-wrap: balance; }
rt { font-size: .42em; color: var(--dim); font-weight: 400; }
.hero rt { font-size: .24em; }
.hero.sentence rt { font-size: max(.32em, 11px); }
.nofuri rt { visibility: hidden; }
/* Stages without furigana still lay out the key word's, so the cheat moves nothing. */
.hidekey:not(.sentence) rt, .hidekey.sentence mark rt { visibility: hidden; }
/* AnimCJK sits over the invisible font glyph, so swapping it in never moves the layout. */
.strokeChar { position: relative; }
.strokeChar.drawing { color: transparent; }
.strokeChar svg { position: absolute; left: 0; top: 50%; width: 1em; height: 1em; transform: translateY(-50%); pointer-events: none; }
@keyframes zk { to { stroke-dashoffset: 0; } }
svg.acjk path[id] { fill: var(--line); }
.more svg.acjk path[id] { fill: color-mix(in srgb, var(--ink) 18%, var(--tint)); }
svg.acjk.still path[id], .more svg.acjk.still path[id] { fill: var(--ink); }
svg.acjk.still path[clip-path] { display: none; }
svg.acjk path[clip-path] {
  animation: zk var(--t) linear forwards var(--d);
  stroke-dasharray: 3337; stroke-dashoffset: 3339; stroke-width: 128;
  stroke-linecap: round; fill: none; stroke: var(--ink);
}
.heat { margin: 0 12px 30px; }
.heat .scroller { overflow-x: auto; }
.heat .grid { display: grid; grid-template-rows: auto repeat(7, 28px); grid-auto-columns: 28px; gap: 3px; width: max-content; padding: 2px; }
.heat .month { grid-row: 1; font-size: .8rem; color: var(--dim); white-space: nowrap; line-height: 1.5; }
.heat .cell { border-radius: 3px; background: color-mix(in srgb, var(--line) 55%, var(--bg)); }
.heat .grid .cell { display: flex; align-items: center; justify-content: center; font-size: .78rem; font-variant-numeric: lining-nums; color: var(--dim); }
.heat .cell.future { background: none; opacity: .55; }
.heat .cell[data-level] { background: color-mix(in srgb, var(--accent) calc(var(--level) * 25%), var(--bg)); }
.heat .grid .cell[data-level] { color: var(--ink); }
.heat .grid .cell[data-level="3"], .heat .grid .cell[data-level="4"] { color: var(--bg); }
.heat .cell.today { outline: 1px solid var(--ink); outline-offset: 1px; }
.heat .key { display: flex; justify-content: space-between; gap: 16px; color: var(--dim); font-size: .95rem; margin-top: 8px; min-height: 1.5em; flex-wrap: wrap; }
.heat .scale { display: inline-flex; align-items: center; gap: 3px; }
.heat .scale .cell { width: 11px; height: 11px; }
.weeknav { display: flex; align-items: baseline; gap: 16px; margin: 0 0 18px 12px; }
.weeknav h1 { margin: 0; min-width: 8.5em; }
.weeknav button { color: var(--dim); padding: 0 6px; }
.weeknav button:hover:not(:disabled) { color: var(--ink); }
.weeknav button:disabled { opacity: .3; cursor: default; }
.weeknav { flex-wrap: wrap; }
.weeknav .over, .weeknav .prac { margin-left: auto; margin-right: 12px; font-size: .95rem; }
.weeknav .prac + .over { margin-left: 0; }
dialog.practice {
  width: min(440px, calc(100vw - 32px)); padding: 20px 24px 18px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); font-size: 1.05rem;
}
dialog.practice::backdrop { background: rgb(0 0 0 / .35); }
dialog.practice h2 { font: 400 1.5rem var(--en); margin: 0 0 12px; }
dialog.practice fieldset { border: 0; margin: 0 0 12px; padding: 0; min-width: 0; }
dialog.practice legend { color: var(--dim); font-size: .9rem; padding: 0; margin-bottom: 4px; }
dialog.practice .pick { display: flex; align-items: center; gap: 8px; padding: 5px 0; flex-wrap: wrap; }
dialog.practice .pick.sub { padding-left: 26px; color: var(--dim); font-size: .95rem; }
dialog.practice input { accent-color: var(--accent); margin: 0; }
dialog.practice select { font: inherit; color: var(--ink); background: var(--tint); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; max-width: 100%; }
dialog.practice .count { color: var(--dim); margin: 2px 0 14px; }
dialog.practice .buttons { display: flex; justify-content: flex-end; gap: 22px; flex-wrap: wrap; }
dialog.practice .act:disabled { opacity: .35; cursor: default; }
.credit { color: var(--dim); font-size: .85rem; margin-top: 28px; }
#strokeBtn.on, #voiceBtn.on { color: var(--ink); }
mark { background: none; color: var(--accent); }
.reading { font-family: var(--ja); font-size: 1.5rem; }
.gloss { font-size: 1.35rem; max-width: 34em; }
.trans { color: var(--dim); font-style: italic; }
a.src { color: var(--dim); opacity: .6; font-style: normal; font-size: .8em; text-decoration: none; margin-left: 4px; }
a.src:hover { opacity: 1; color: var(--ink); }
.note { color: var(--dim); font-size: .95rem; }
.actions { display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: center; align-items: center; }
.actions.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 8em)); justify-content: center; justify-items: center; gap: 4px 16px; }
.actions.slots.many { grid-template-columns: repeat(6, minmax(0, 7em)); }
.actions.slots.five { grid-template-columns: repeat(5, minmax(0, 6.5em)); column-gap: 6px; }
@media (max-width: 640px) {
  .actions.slots.many { grid-template-columns: repeat(3, minmax(0, 7em)); }
  main:has(.many) { --ctl: 6.75rem; }
}
.act { padding: 6px 2px; border-bottom: 1px solid var(--line); }
.act:hover { border-color: var(--ink); }
.act kbd { font: inherit; color: var(--dim); font-size: .85em; margin-left: 6px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(560px, 100%); }
.choice { font-family: var(--ja); font-size: clamp(1.3rem, 4vw, 1.8rem); padding: 9px 8px; border: 1px solid var(--line); overflow-wrap: anywhere; }
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice.right { border-color: var(--good); color: var(--good); }
.choice.wrong { border-color: var(--accent); color: var(--accent); }
.typed {
  font: 400 clamp(1.8rem, 6vw, 3rem) var(--ja); color: var(--ink); text-align: center;
  background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  width: min(460px, 100%); margin-top: 24px; padding: 6px;
}
.typed:focus { outline: 0; border-color: var(--ink); }
.typed.wrong { color: var(--accent); text-decoration: line-through; }
.answer .hero.long { font-size: clamp(2.2rem, 6vw, 3.4rem); }

body.zen:not(.listing) header #label, body.zen footer { opacity: 0; }
body.zen footer:hover, body.zen footer:focus-within { opacity: 1; }
body.zen #count { color: var(--dim); }
body.zen .act kbd, body.zen .level { display: none; }
/* Hotkeys only in zen, except on touch screens, which have no keyboard. */
@media (hover: hover) and (pointer: fine) {
  body.zen .actions.hotkeys, body.zen .cheat { visibility: hidden; }
}
/* Controls whose every action has a gesture: zen hides them on touch screens too (all but .stay). */
body.zen .actions.gestures > :not(.stay), body.zen .cheat { visibility: hidden; }
/* In zen only the buttons with no gesture remain (Got it · Missed, Undo): centre them instead of leaving them in their slots. */
body.zen .actions.slots.gestures:has(> .stay) { display: flex; justify-content: center; }
body.zen .actions.slots.gestures:has(> .stay) > :not(.stay) { display: none; }
body.zen .actions.slots.gestures > .stay { min-width: 7em; }
body.zen .hero:not(.en):not(.sentence):not(.long) { font-size: min(clamp(5.3rem, 21.6vw, 13.2rem), var(--fit5)); }
body.zen .hero.en { font-size: clamp(3.1rem, 9.6vw, 6.5rem); }
/* Touch: bigger targets, no key hints, and a zen footer that can be seen before it is tapped. */
@media (pointer: coarse) {
  .touchOnly { display: inline-block; }
  footer { gap: 2px 6px; padding-top: 8px; }
  footer button { padding: 8px 6px; }
  body.zen footer { opacity: .45; }
  .act { padding: 10px 8px; }
  .act kbd { display: none; }
  .actions { gap: 8px 24px; }
  .weeknav button { padding: 6px 14px; }
  .ex .say::before { left: -38px; top: -20px; width: 40px; height: 40px; }
}
main.dragging { transition: none; }
main.settling { transition: transform .18s ease-out, opacity .18s ease-out; }

.list { width: min(720px, 100%); margin: 0 auto; padding: 84px 16px 88px; }
.list h1 { font: 400 1.5rem var(--en); margin: 0 0 18px 12px; }
.list { overflow-anchor: none; }   /* stepRow positions rows itself */
.list:has(.more) { padding-bottom: 100vh; }   /* lets the last rows scroll to the top */
.row { display: grid; grid-template-columns: minmax(7em, 2fr) 3fr 3.6em; gap: 16px; width: 100%; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: baseline; }
.row .w { font-family: var(--ja); font-size: 1.35rem; overflow-wrap: anywhere; }
.row .c { color: var(--dim); }
.row:hover .c { color: var(--ink); }
.row .st { color: var(--dim); font-size: .85rem; font-variant-numeric: lining-nums tabular-nums; text-align: right; white-space: nowrap; }
.row .st .pass { color: var(--good); }
.row .st .fail { color: var(--accent); }
.row.open { background: var(--rowOpen); border-bottom-color: transparent; }
.row:focus-visible { outline: none; }
.row.open .c { color: var(--ink); }
.more { padding: 4px 12px 20px 36px; background: var(--tint); border-bottom: 1px solid var(--line); text-align: left; }
.panelword { font-family: var(--ja); font-size: clamp(3.4rem, 12vw, 5.5rem); line-height: 1.35; overflow-wrap: anywhere; }
.panelword.long { font-size: clamp(2.2rem, 7vw, 3.4rem); }
.ex { margin: 14px 0 0; }

<script>
"use strict";
const WEEK_SIZE = 100, STORE_KEY = "vocab-drill.v1";
const STAGES = [
  { kind: "id", furigana: true, context: true, label: "Recognition · furigana · in context" },
  { kind: "id", furigana: false, context: true, label: "Recognition · in context" },
  { kind: "id", furigana: true, context: false, label: "Recognition · furigana" },
  { kind: "id", furigana: false, context: false, label: "Recognition" },
  { kind: "choice", label: "Production · choose" },
  { kind: "type", label: "Production · type" },
];

/* ---------- data ---------- */
const WORDS = JSON.parse(document.getElementById("words").textContent).map(
  ([expr, reading, gloss, capsule, level, rank, slug]) => {
    const forms = expr.split(/[;；]/).map(s => s.trim()).filter(Boolean);
    const readings = reading.split(/[;；]/).map(s => s.trim()).filter(Boolean);
    return { id: forms[0] + "|" + readings[0], forms, readings, word: forms[0], kana: readings[0], sound: readings[0].replace(/\s*[(（][^)）]*[)）]/g, "").replace(/[～~]/g, "").trim(), gloss, capsule, level, rank, slug };
  });
const BY_ID = new Map(WORDS.map(w => [w.id, w]));

/* ---------- storage ---------- */
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
const DEFAULTS = { status: {}, results: {}, week: null, day: null, last: null, plain: false, theme: null, strokes: false, strokeSpeed: "quick", font: "textbook", history: [], voice: false, log: {}, weeks: [], practice: null, practiceOpts: null, revlog: [], srs: {}, srsDay: null, sched: "fsrs", target: 0.9 };
const S = Object.assign(structuredClone(DEFAULTS), loadState());
/* Older saves kept only the previous week's words, without its date. */
if (S.prev && S.prev.length && !S.weeks.length && S.week) {
  const start = new Date(S.week.start + "T12:00");
  start.setDate(start.getDate() - 7);
  S.weeks.push({ start: iso(start), ids: S.prev });
}
delete S.prev;
/* Answers from before the activity log all fall on the first day of the first week. */
if (!S.logBackfilled && S.week) {
  const review = S.day ? S.day.cleared.length + S.day.missed.length : 0;
  const answers = Object.keys(S.status).length + review;
  S.log[S.week.start] = Math.max(S.log[S.week.start] || 0, answers);
  S.logBackfilled = true;
}
/* Weeks saved before the skipped counter existed: only the first week can be mid-diagnostic. */
if (S.week && !S.week.ready && S.week.skipped === undefined) {
  S.week.skipped = Object.values(S.status).filter(v => v === "s").length;
}
function save() {
  S.savedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
  scheduleSync();
}
/* GitHub sync settings: their own key, so the token is never part of the synced state. */
const SYNC_KEY = "vocab-drill.sync";
let syncCfg = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)); } catch { return null; } })();
let syncTimer = null, syncing = null;

/* ---------- dates (local time) ---------- */
function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/* Days turn over at 5am, so a late-night session still counts toward the day it began. */
const DAY_STARTS_AT = 5;
function drillNow() {
  const d = new Date();
  d.setHours(d.getHours() - DAY_STARTS_AT);
  return d;
}
function currentDay() {
  return iso(drillNow());
}
function daysBetween(from, to) {
  return Math.round((new Date(to + "T12:00") - new Date(from + "T12:00")) / 864e5);
}
/* Misses from before missedOn was kept: dated by their week, at the latest day it could have reviewed them. */
if (!S.missBackfilled) {
  const when = new Map(), today = currentDay();
  const addDays = (day, n) => { const d = new Date(day + "T12:00"); d.setDate(d.getDate() + n); return iso(d); };
  for (const w of S.weeks) for (const id of w.ids) when.set(id, addDays(w.start, STAGES.length));
  if (S.week) for (const id of S.week.ids) when.set(id, S.day ? S.day.date : S.week.start);
  for (const [id, r] of Object.entries(S.results)) {
    if (r.missedOn || r.passed >= r.total) continue;
    const day = when.get(id) || today;
    r.missedOn = day > today ? today : day;
  }
  S.missBackfilled = true;
}

/* ---------- review log and memory ---------- */
/* Every graded answer, oldest first: [unix seconds, word id, card, rating, ms, seed].
   Card 0 is recognition, 1 production (two sibling cards of one word); rating 1 Again, 2 Hard, 3 Good, 4 Easy;
   ms is how long the answer took. Seed entries (1 in the sixth place) only stand in for reviews from before
   the log existed, so a past week's words can be scheduled; they are never shown to RWKV. */
const RECOGNITION = 0, PRODUCTION = 1, GRADES = ["", "Again", "Hard", "Good", "Easy"];
/* One card per word: the format a review is asked in doesn't matter to the schedule. Entries logged
   before this as production (card 1) fold into the word's one card. */

/* FSRS-6 with its default parameters: the scheduler until RWKV is chosen, and RWKV's yardstick. */

    1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];

  const interval = (s, target) => s / factor * (Math.pow(target, 1 / decay) - 1);

  function next(m, g, days) {
    if (!m) return { s: w[g - 1], d: d0(g) };
    let s;
    if (days < 1) {   /* same day */
      s = m.s * Math.exp(w[17] * (g - 3 + w[18])) * Math.pow(m.s, -w[19]);
      if (g >= 3) s = Math.max(s, m.s);
    } else {
      const r = recall(days, m.s);
      s = g === 1
        ? Math.min(m.s, w[11] * Math.pow(m.d, -w[12]) * (Math.pow(m.s + 1, w[13]) - 1) * Math.exp(w[14] * (1 - r)))
        : m.s * (1 + Math.exp(w[8]) * (11 - m.d) * Math.pow(m.s, -w[9]) * (Math.exp(w[10] * (1 - r)) - 1)

    const d = m.d - w[6] * (g - 3) * (10 - m.d) / 9;

/* ---------- RWKV ---------- */
/* The RWKV-Curve model runs in a worker (rwkv.js, a port of the MIT reference in JSchoreels/anki-rwkv).
   Its weights come from a pinned commit of the Anki fork; personal use only, so they are fetched, never
   committed here. It reads the whole log, then each new answer, and returns each card's forgetting curve
   and its prediction before every answer. Seed entries are skipped by the worker. */

};

  rwkv.pending.push(type);
  entries = entries.map(e => e[2] ? [e[0], e[1], RECOGNITION, ...e.slice(3)] : e);
  rwkv.worker.postMessage({ type, [type === "replay" ? "log" : "entries"]: entries,
    dayStartHour: DAY_STARTS_AT, tzOffsetMinutes: -new Date().getTimezoneOffset() });
}

  rwkv.preds = null;

}

    const m = e.data;
    if (m.type === "ready") {
      rwkv.ready = true;
      rwkv.info = RWKV_SIZES[m.size] + " · " + Math.round(m.bytes / 1024) + " KB";
      rwkv.status = "reading your history…";
      rwkvReplay();
    } else if (m.type === "curves") {
      const kind = rwkv.pending.shift(), first = !rwkv.curves;
      if (kind === "replay") { rwkv.curves = m.curves; rwkv.preds = m.preds; }
      else if (rwkv.preds) { Object.assign(rwkv.curves, m.curves); rwkv.preds.push(...m.preds); }
      if (first) {
        rwkv.status = "ready";
        console.info("rwkv: " + S.revlog.length + " answers read in " + Math.round(m.ms) + " ms");
        if (location.hash === "#memory") render();

    } else if (m.type === "error") {
      rwkv.pending.shift();

      console.warn("rwkv:", m.message);

function rwkvRecall(p, nowSeconds) {
  const t = Math.max(nowSeconds - p.at, 1);

  for (let i = 0; i < p.w.length; i++) r += p.w[i] * Math.exp(-p.d[i] * Math.log1p(t / (1e-7 + p.s[i])));

      S.srs[id] = end;
      const r = S.results[id];

      S.revlog.push([t, id, RECOGNITION, r && r.last ? 3 : 1, 0, 1]);

/* Loaded separately because it is many times the size of the app. */
const sentencesReady = new Promise(resolve => {
  const script = document.createElement("script");

function parseTranscription(text) {
  /* "[食|た]べる" and "[学校|がっ|こう]" → tokens with optional readings */
  const tokens = [], rx = /\[([^|\]]+)\|([^\]]*)\]|([^[]+|\[)/g;

/* Kept for the tab's session so Google isn't asked again. */

  const text = meta.content ? fromBase64(meta.content) : await (await github("GET", null, "application/vnd.github.raw+json")).text();
  return { sha: meta.sha, data: JSON.parse(text) };
}
async function pushState() {
  const pushedAt = S.savedAt || Date.now();
  const body = { message: "sync from " + deviceName(), content: toBase64(JSON.stringify(S, null, 1) + "\n") };
  if (syncCfg.sha) body.sha = syncCfg.sha;
  const res = await github("PUT", body);
  if (!res.ok) return false;   /* someone else committed first */
  syncCfg.sha = (await res.json()).content.sha;
  syncCfg.syncedAt = pushedAt;
  saveSyncCfg();
  return true;
}
/* Both devices answered since the last sync: keep every answer from both. */
function mergeStates(a, b) {
  const [older, newer] = (a.savedAt || 0) > (b.savedAt || 0) ? [b, a] : [a, b];
  const m = { ...older, ...newer };   /* settings, history and the rest: the newer device's */
  m.status = { ...older.status, ...newer.status };
  m.results = { ...older.results };
  for (const [id, r] of Object.entries(newer.results || {}))
    if (!m.results[id] || r.total >= m.results[id].total) m.results[id] = r;
  m.log = { ...older.log };
  for (const [day, n] of Object.entries(newer.log || {})) m.log[day] = Math.max(m.log[day] || 0, n);
  const byStart = (x, y) => x.start < y.start ? -1 : x.start > y.start ? 1 : 0;
  const weekProgress = w => (w.ready ? 1e6 : 0) + w.ids.length + (w.skipped || 0);
  const weeks = [older.week, newer.week].filter(Boolean);
  m.week = weeks.length === 2 && weeks[0].start === weeks[1].start
    ? (weekProgress(weeks[0]) > weekProgress(weeks[1]) ? weeks[0] : weeks[1])
    : weeks.sort(byStart).pop() || null;
  const past = new Map();
  for (const w of [...(older.weeks || []), ...(newer.weeks || []), ...weeks])
    if (w && w.ids.length && (!m.week || w.start !== m.week.start)) past.set(w.start, { start: w.start, ids: w.ids });
  m.weeks = [...past.values()].sort(byStart);
  /* Both logs, each answer once, in order. */
  const seen = new Set();
  m.revlog = [...(older.revlog || []), ...(newer.revlog || [])]
    .filter(e => { const k = e.slice(0, 4).join("\u0000"); return !seen.has(k) && seen.add(k); })
    .sort((x, y) => x[0] - y[0]);
  m.srs = { ...older.srs, ...newer.srs };
  const dayProgress = d => d.round * 1e6 + d.cleared.length + d.missed.length;
  const days = [older.day, newer.day].filter(Boolean);
  m.day = days.length === 2 && days[0].date === days[1].date
    ? (dayProgress(days[0]) > dayProgress(days[1]) ? days[0] : days[1])
    : days.sort((x, y) => x.date < y.date ? -1 : 1).pop() || null;
  const reviewDays = [older.srsDay, newer.srsDay].filter(Boolean);
  m.srsDay = reviewDays.length === 2 && reviewDays[0].date === reviewDays[1].date
    ? (dayProgress(reviewDays[0]) > dayProgress(reviewDays[1]) ? reviewDays[0] : reviewDays[1])
    : reviewDays.sort((x, y) => x.date < y.date ? -1 : 1).pop() || null;
  return m;
}
/* Replace the state in place (S is const) and redraw. */
function adopt(data, changed) {
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, structuredClone(DEFAULTS), data);
  memo = null;
  rwkvReplay();
  if (changed) S.savedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
  paintChrome();
  render();
}
/* Pull, merge if both sides changed, push if this side has news. Callable from JS: vocabSync.now(). */
function syncNow() {
  if (!syncCfg) return setupSync();
  clearTimeout(syncTimer);
  if (syncing) return syncing;
  syncStatus("busy");
  syncing = (async () => {
    for (let attempt = 0; attempt < 3; attempt++) {
      const remote = await fetchRemote();
      if (!remote) syncCfg.sha = null;
      else if (remote.sha !== syncCfg.sha) {
        const mine = isDirty() && Object.keys(S.status).length > 0;
        adopt(mine ? mergeStates(S, remote.data) : remote.data, mine);
        syncCfg.sha = remote.sha;
        if (!mine) syncCfg.syncedAt = S.savedAt || 1;
        saveSyncCfg();
      }
      if (!isDirty() || await pushState()) return;
    }
    throw new Error("GitHub kept changing underneath; try again");
  })();
  return syncing.then(() => {
    syncing = null;
    syncStatus("ok", "Synced with " + syncCfg.repo + " at " + new Date().toLocaleTimeString() + " (y; Y for settings)");
    if (isDirty()) scheduleSync();   /* answered while it was syncing */
  }, err => {
    syncing = null;
    syncStatus("err", String(err.message || err) + " — tap to retry or change settings");
    console.warn("sync:", err);
  });
}
function setupSync() {
  const repo = prompt("Sync to GitHub: repository as owner/name (make it private). Leave empty to turn sync off.", syncCfg ? syncCfg.repo : "");
  if (repo === null) return;
  if (!repo.trim()) {
    syncCfg = null;
    try { localStorage.removeItem(SYNC_KEY); } catch {}
    return syncStatus("off");
  }
  const token = prompt("Fine-grained personal access token with Contents: read and write on " + repo.trim() + " only." +
    (syncCfg ? " Leave empty to keep the current one." : ""), "");
  if (token === null || (!token.trim() && !syncCfg)) return;
  const path = prompt("File in the repo", syncCfg ? syncCfg.path : "vocab-drill.json");
  if (path === null) return;
  const same = syncCfg && syncCfg.repo === repo.trim() && syncCfg.path === (path.trim() || "vocab-drill.json");
  syncCfg = {
    repo: repo.trim(), path: path.trim() || "vocab-drill.json",
    token: token.trim() || syncCfg.token,
    sha: same ? syncCfg.sha : null, syncedAt: same ? syncCfg.syncedAt : 0,
  };
  saveSyncCfg();
  return syncNow();
}
function clickSync() {
  if (document.getElementById("syncBtn").classList.contains("err")
      && confirm(document.getElementById("syncBtn").title.replace(/ — .*$/, "") + "\n\nChange sync settings? (Cancel retries.)")) return setupSync();
  syncNow();
}
window.vocabSync = { now: syncNow, setup: setupSync, get state() { return S; } };

/* ---------- chrome ---------- */
function paintChrome() {
  applyTheme();
  applyFont();
  paintSpeed();
  paintSpeaker();
  document.getElementById("strokeBtn").classList.toggle("on", S.strokes);
  document.getElementById("voiceBtn").classList.toggle("on", S.voice);
  document.getElementById("speedBtn").textContent = S.strokeSpeed;
  document.getElementById("strokeBtn").textContent = S.strokes ? "on" : "off";
  document.getElementById("voiceBtn").textContent = S.voice ? "on" : "off";
  document.getElementById("zenBtn").textContent = S.plain ? "shown" : "gestures only";
  document.getElementById("themeBtn").textContent = S.theme || "system";
}
const openListen = () => { location.hash = "#listen"; };
const sheet = document.getElementById("sheet");
sheet.addEventListener("click", e => {
  if (e.target === sheet) return sheet.close();   /* a tap on the backdrop */
  setTimeout(paintChrome);   /* after the button's own handler */
});
document.getElementById("todayBtn").addEventListener("click", () => go("#today"));
document.getElementById("listenBtn").addEventListener("click", () => { listenIds = null; go("#listen"); });
document.getElementById("practiceBtn").addEventListener("click", () => { sheet.close(); openPractice(); });
document.getElementById("lookBtn").addEventListener("click", () => { if (lookup) window.open(wordUrl(lookup), "_blank", "noopener"); });
document.getElementById("strokesOnceBtn").addEventListener("click", () => { sheet.close(); if (strokeHero) drawWord(strokeHero, true); });
document.getElementById("endBtn").addEventListener("click", () => { location.hash = "#today"; });
document.getElementById("graded").addEventListener("click", undoGrade);
document.getElementById("memoryBtn").addEventListener("click", () => go("#memory"));
document.getElementById("strokeBtn").addEventListener("click", toggleStrokes);
document.getElementById("voiceBtn").addEventListener("click", toggleVoice);
document.getElementById("speakerBtn").addEventListener("click", cycleSpeaker);
document.getElementById("speedBtnTts").addEventListener("click", () => setSpeed(1));
document.getElementById("fontBtn").addEventListener("click", cycleFont);
document.getElementById("speedBtn").addEventListener("click", cycleStrokeSpeed);
document.getElementById("zenBtn").addEventListener("click", toggleZen);
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("askBtn").addEventListener("click", () => { sheet.close(); explainGoogle(); });
document.getElementById("syncBtn").addEventListener("click", clickSync);
paintChrome();
const holdShift = held => document.body.classList.toggle("shift", held);
document.addEventListener("keyup", e => { if (e.key === "Shift") holdShift(false); });
addEventListener("blur", () => holdShift(false));
document.addEventListener("keydown", e => {
  if (e.key === "Shift") holdShift(true);
  if (e.metaKey || e.ctrlKey || e.altKey || (practiceDialog && practiceDialog.open) || document.getElementById("sheet").open) return;
  const typing = e.target.tagName === "INPUT";
  if (e.key === "Escape" && !document.getElementById("explain").hidden) { e.preventDefault(); return closeExplain(); }
  if ((e.key === "e" || e.key === "E") && (!typing || e.target.readOnly)) {
    e.preventDefault();
    return e.key === "e" ? explain() : explainGoogle();
  }
  if (e.key === "Escape" && (!location.hash || location.hash === "#practice")) { e.preventDefault(); location.hash = "#today"; return; }
  if (keys && (!typing || e.target.readOnly) && keys(e) !== false) { e.preventDefault(); return; }
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !location.hash
      && (!typing || e.target.readOnly || !e.target.value)) {
    e.preventDefault();
    return e.key === "ArrowLeft" && peek === null ? goBack() : stepHistory(e.key === "ArrowLeft" ? -1 : 1);
  }
  if (typing && !e.target.readOnly) return;
  if (e.key === "l" && lookup) window.open(wordUrl(lookup), "_blank", "noopener");
  else if (e.key === "L" && lookup) window.open(hasKanji(lookup.word) ? kanjiUrl(lookup.word) : wordUrl(lookup), "_blank", "noopener");
  else if (e.key === "s" && strokeHero) drawWord(strokeHero, true);
  else if (e.key === "S") toggleStrokes();
  else if (e.key === "q") cycleStrokeSpeed();
  else if (e.key === "r") speak();
  else if (e.key === "R") toggleVoice();
  else if (e.key === "c") cycleFont();
  else if (e.key === "z") toggleZen();
  else if (e.key === "d") toggleTheme();
  else if (e.key === "a") { listenIds = null; location.hash = "#listen"; }
  else if (e.key === "t") location.hash = "#today";
  else if (e.key === ".") openSheet();
  else if (e.key === "p") openPractice();
  else if (e.key === "m") location.hash = "#memory";
  else if (e.key === "u" && lastGrade && (!location.hash || location.hash === "#practice")) undoGrade();
  else if (e.key === "v") cycleSpeaker();
  else if (e.key === "-") setSpeed(speechSpeed() - 0.1);
  else if (e.key === "=" || e.key === "+") setSpeed(speechSpeed() + 0.1);
  else if (e.key === "y") syncNow();
  else if (e.key === "Y") setupSync();
});
addEventListener("hashchange", () => {
  viewedWeek = location.hash === "#week" ? pendingWeek : null;
  pendingWeek = null;
  if (location.hash !== "#listen") listenIds = null;
  listening = null; lastGrade = null; hideGraded(); render();
});
document.addEventListener("visibilitychange", () => {
  if (syncCfg && (document.visibilityState === "visible" || isDirty())) syncNow();   /* pull on return, push on leave */
  if (document.visibilityState !== "visible" || (location.hash && location.hash !== "#today")) return;
  if (renderedOn !== currentDay()) render();
});
/* The card's zones sit between the header and the navbar, whatever their height. */
const measureChrome = () => {
  const root = document.documentElement.style;
  root.setProperty("--headH", document.querySelector("header").offsetHeight + "px");
  root.setProperty("--footH", document.getElementById("dock").offsetHeight + "px");
};
new ResizeObserver(measureChrome).observe(document.querySelector("header"));
new ResizeObserver(measureChrome).observe(document.getElementById("dock"));
if (!location.hash) history.replaceState(null, "", "#today");   /* the app opens on Today */
render();
if (syncCfg) syncNow();
setTimeout(startRwkv, 1500);   /* after the first card is up */
/* Installed on a touch device: true fullscreen, bars and all. Android only grants it on a touch, and drops it when
   you leave the app, so ask again on the next touch. (iOS has no fullscreen for pages.) */
if (matchMedia("(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)").matches
    && matchMedia("(pointer: coarse)").matches && document.documentElement.requestFullscreen)
  addEventListener("touchend", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  }, { capture: true, passive: true });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  navigator.serviceWorker.register("sw.js").catch(err => console.warn("offline support:", err));
</script>
