<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Drill</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400&family=Shippori+Mincho:wght@400&family=Reggae+One&family=Yuji+Boku&family=Zen+Maru+Gothic:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ec; --ink: #211d18; --dim: #8a8276; --line: #dcd5c8; --tint: #ebe5d8; --rowOpen: #dbd2bf;
  --accent: #a4412d; --good: #4d6b4f;
  --en: "EB Garamond", Georgia, serif;
  --ja: "Klee One", "YuKyokasho", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --ink: #e9e3d6; --dim: #80796d; --line: #322e27; --tint: #24211b; --rowOpen: #1b1914;
    --accent: #dc8b70; --good: #93b295;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --ink: #e9e3d6; --dim: #80796d; --line: #322e27; --tint: #24211b; --rowOpen: #1b1914;
  --accent: #dc8b70; --good: #93b295;
}
:root[data-font="mincho"] { --ja: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; }
:root[data-font="gothic"] { --ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
:root[data-font="rounded"] { --ja: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; }
:root[data-font="edomoji"] { --ja: "Reggae One", "Hiragino Mincho ProN", serif; }
:root[data-font="calligraphy"] { --ja: "Yuji Boku", "Hiragino Mincho ProN", serif; }
:root { --fit5: calc((100vw - 32px) / 5); }   /* five full-width characters inside the gutters */
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }   /* no pull-to-refresh mid-swipe */
body {
  background: var(--bg); color: var(--ink);
  font: 400 1.15rem/1.5 var(--en), var(--ja);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;   /* no double-tap zoom, no tap delay */
}
a, button { color: inherit; font: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

header {
  position: fixed; inset: 0 0 auto 0; z-index: 2;
  display: flex; justify-content: space-between; align-items: baseline;
  padding: max(18px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 18px max(24px, env(safe-area-inset-left));
  color: var(--dim); font-size: 1rem;
}
#label { transition: opacity .3s; }
#count { color: var(--ink); text-decoration: none; font-variant-numeric: lining-nums tabular-nums; }
#count.past { color: var(--dim); }
#skipped { color: var(--dim); margin-right: 14px; }
#skipped:empty { display: none; }
footer {
  position: fixed; inset: auto 0 0 0; display: flex; justify-content: center; gap: 22px;
  padding: 16px 16px max(16px, env(safe-area-inset-bottom)); color: var(--dim); font-size: .95rem; transition: opacity .3s; flex-wrap: wrap;
}
#syncBtn.err { color: var(--accent); }
.touchOnly { display: none; }
footer button:hover { color: var(--ink); }
body.weekList footer { display: none; }
#explain {
  position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 3;
  width: min(640px, calc(100vw - 32px)); max-height: 45vh; overflow-y: auto;
  padding: 14px 18px; background: var(--tint); border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); font-size: 1.05rem; line-height: 1.5; white-space: pre-wrap;
}
#explain .q { font-family: var(--ja); color: var(--dim); margin-bottom: 6px; white-space: normal; }
#explain .q b { color: var(--accent); font-weight: normal; }
#explain .err { color: var(--accent); }

main {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 72px 16px 72px; text-align: center;
}
.hero { font-family: var(--ja); font-weight: 400; line-height: 1.35; font-size: min(clamp(4.1rem, 15.6vw, 9rem), var(--fit5)); overflow-wrap: anywhere; }
.hero:not(.long):not(.en):not(.sentence) { white-space: nowrap; }
.hero.long { font-size: clamp(2.9rem, 9.6vw, 5.8rem); }
.hero.en { font-family: var(--en); font-size: clamp(2.6rem, 7.8vw, 5rem); line-height: 1.2; }
.hero.sentence { font-size: clamp(2rem, 5.5vw, 3.6rem); line-height: 2; max-width: 22em; }
rt { font-size: .42em; color: var(--dim); font-weight: 400; }
.hero rt { font-size: .24em; }
.hero.sentence rt { font-size: max(.32em, 11px); }
.nofuri rt { visibility: hidden; }
/* Stages without furigana still lay out the key word's, so the cheat moves nothing. */
.hidekey:not(.sentence) rt, .hidekey.sentence mark rt { visibility: hidden; }
/* AnimCJK sits over the invisible font glyph, so swapping it in never moves the layout. */
.strokeChar { position: relative; }
.strokeChar.drawing { color: transparent; }
.strokeChar svg { position: absolute; left: 0; top: 50%; width: 1em; height: 1em; transform: translateY(-50%); pointer-events: none; }
@keyframes zk { to { stroke-dashoffset: 0; } }
svg.acjk path[id] { fill: var(--line); }
.more svg.acjk path[id] { fill: color-mix(in srgb, var(--ink) 18%, var(--tint)); }
svg.acjk.still path[id], .more svg.acjk.still path[id] { fill: var(--ink); }
svg.acjk.still path[clip-path] { display: none; }
svg.acjk path[clip-path] {
  animation: zk var(--t) linear forwards var(--d);
  stroke-dasharray: 3337; stroke-dashoffset: 3339; stroke-width: 128;
  stroke-linecap: round; fill: none; stroke: var(--ink);
}
.heat { margin: 0 12px 30px; }
.heat .scroller { overflow-x: auto; }
.heat .grid { display: grid; grid-template-rows: auto repeat(7, 28px); grid-auto-columns: 28px; gap: 3px; width: max-content; padding: 2px; }
.heat .month { grid-row: 1; font-size: .8rem; color: var(--dim); white-space: nowrap; line-height: 1.5; }
.heat .cell { border-radius: 3px; background: color-mix(in srgb, var(--line) 55%, var(--bg)); }
.heat .grid .cell { display: flex; align-items: center; justify-content: center; font-size: .78rem; font-variant-numeric: lining-nums; color: var(--dim); }
.heat .cell.future { background: none; opacity: .55; }
.heat .cell[data-level] { background: color-mix(in srgb, var(--accent) calc(var(--level) * 25%), var(--bg)); }
.heat .grid .cell[data-level] { color: var(--ink); }
.heat .grid .cell[data-level="3"], .heat .grid .cell[data-level="4"] { color: var(--bg); }
.heat .cell.today { outline: 1px solid var(--ink); outline-offset: 1px; }
.heat .key { display: flex; justify-content: space-between; gap: 16px; color: var(--dim); font-size: .95rem; margin-top: 8px; min-height: 1.5em; flex-wrap: wrap; }
.heat .scale { display: inline-flex; align-items: center; gap: 3px; }
.heat .scale .cell { width: 11px; height: 11px; }
.weeknav { display: flex; align-items: baseline; gap: 16px; margin: 0 0 18px 12px; }
.weeknav h1 { margin: 0; min-width: 8.5em; }
.weeknav button { color: var(--dim); padding: 0 6px; }
.weeknav button:hover:not(:disabled) { color: var(--ink); }
.weeknav button:disabled { opacity: .3; cursor: default; }
.weeknav .over { margin-left: auto; margin-right: 12px; font-size: .95rem; }
.credit { color: var(--dim); font-size: .85rem; margin-top: 28px; }
#strokeBtn.on, #voiceBtn.on { color: var(--ink); }
mark { background: none; color: var(--accent); }
.answer { min-height: 6.5rem; margin-top: 18px; }
.reading { font-family: var(--ja); font-size: 1.5rem; }
.gloss { font-size: 1.35rem; max-width: 34em; }
.trans { color: var(--dim); font-style: italic; }
a.src { color: var(--dim); opacity: .6; font-style: normal; font-size: .8em; text-decoration: none; margin-left: 4px; }
a.src:hover { opacity: 1; color: var(--ink); }
.note { color: var(--dim); font-size: .95rem; min-height: 1.5em; margin-top: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: center; margin-top: 22px; min-height: 2.6rem; }
.actions.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 8em)); justify-content: center; justify-items: center; gap: 12px 16px; }
.actions.aux { margin-top: 10px; min-height: 0; }
.act { padding: 6px 2px; border-bottom: 1px solid var(--line); }
.act:hover { border-color: var(--ink); }
.act kbd { font: inherit; color: var(--dim); font-size: .85em; margin-left: 6px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(560px, 100%); margin-top: 34px; }
.choice { font-family: var(--ja); font-size: clamp(1.3rem, 4vw, 1.8rem); padding: 14px 8px; border: 1px solid var(--line); overflow-wrap: anywhere; }
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice.right { border-color: var(--good); color: var(--good); }
.choice.wrong { border-color: var(--accent); color: var(--accent); }
.typed {
  font: 400 clamp(1.8rem, 6vw, 3rem) var(--ja); color: var(--ink); text-align: center;
  background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  width: min(460px, 100%); margin-top: 34px; padding: 6px;
}
.typed:focus { outline: 0; border-color: var(--ink); }
.typed.wrong { color: var(--accent); text-decoration: line-through; }

body.zen:not(.listing) header #label, body.zen footer { opacity: 0; }
body.zen footer:hover, body.zen footer:focus-within { opacity: 1; }
body.zen #count { color: var(--dim); }
body.zen .act kbd, body.zen .level { display: none; }
/* Hotkeys only in zen, except on touch screens, which have no keyboard. */
@media (hover: hover) and (pointer: fine) {
  body.zen .actions.hotkeys { visibility: hidden; }
}
body.zen .hero:not(.en):not(.sentence):not(.long) { font-size: min(clamp(5.3rem, 21.6vw, 13.2rem), var(--fit5)); }
body.zen .hero.en { font-size: clamp(3.1rem, 9.6vw, 6.5rem); }
/* Touch: bigger targets, no key hints, and a zen footer that can be seen before it is tapped. */
@media (pointer: coarse) {
  .touchOnly { display: inline-block; }
  footer { gap: 2px 6px; padding-top: 8px; }
  footer button { padding: 8px 6px; }
  body.zen footer { opacity: .45; }
  main { padding-bottom: 128px; }
  .act { padding: 10px 8px; }
  .act kbd { display: none; }
  .actions { gap: 8px 24px; }
  .weeknav button { padding: 6px 14px; }
  .ex .say::before { left: -38px; top: -20px; width: 40px; height: 40px; }
}
main.dragging { transition: none; }
main.settling { transition: transform .18s ease-out, opacity .18s ease-out; }

.list { width: min(720px, 100%); margin: 0 auto; padding: 84px 16px 88px; }
.list h1 { font: 400 1.5rem var(--en); margin: 0 0 18px 12px; }
.list { overflow-anchor: none; }   /* stepRow positions rows itself */
.list:has(.more) { padding-bottom: 100vh; }   /* lets the last rows scroll to the top */
.row { display: grid; grid-template-columns: minmax(7em, 2fr) 3fr 3.6em; gap: 16px; width: 100%; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: baseline; }
.row .w { font-family: var(--ja); font-size: 1.35rem; overflow-wrap: anywhere; }
.row .c { color: var(--dim); }
.row:hover .c { color: var(--ink); }
.row .st { color: var(--dim); font-size: .85rem; font-variant-numeric: lining-nums tabular-nums; text-align: right; white-space: nowrap; }
.row .st .pass { color: var(--good); }
.row .st .fail { color: var(--accent); }
.row.open { background: var(--rowOpen); border-bottom-color: transparent; }
.row:focus-visible { outline: none; }
.row.open .c { color: var(--ink); }
.more { padding: 4px 12px 20px 36px; background: var(--tint); border-bottom: 1px solid var(--line); text-align: left; }
.panelword { font-family: var(--ja); font-size: clamp(3.4rem, 12vw, 5.5rem); line-height: 1.35; overflow-wrap: anywhere; }
.panelword.long { font-size: clamp(2.2rem, 7vw, 3.4rem); }
.ex { margin: 14px 0 0; }
/* Zero-size and inline: sits on the text's baseline, so furigana can't move it. .38em is mid-kanji. */
.ex .say { display: inline-block; position: relative; width: 0; height: 0; vertical-align: .38em; overflow: visible; color: color-mix(in srgb, var(--dim) 50%, transparent); }
.ex .say::before { content: ""; position: absolute; left: -28px; top: -12px; width: 24px; height: 24px; }   /* click target */
.ex .say span { position: absolute; right: 8px; top: 0; transform: translateY(-50%); display: grid; place-items: center; box-sizing: border-box; width: 15px; height: 15px; border: 1px solid currentColor; border-radius: 50%; font: 9px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; }
.ex .say:hover { color: var(--accent); }
.ex .say:focus-visible { outline: none; }
.ex .say:focus-visible::before { outline: 1px solid var(--accent); }
.ex .jp { font-family: var(--ja); font-size: 1.25rem; line-height: 2; }
.ex .trans { font-size: .8rem; visibility: hidden; }   /* hidden, not removed: t must not shift the layout */
.ex.showTrans .trans { visibility: visible; }
a.look, a.kanji { color: inherit; text-decoration: none; }
a.look:hover, a.kanji:hover { color: var(--accent); }
.asKanji { display: none; }
body.shift .asKanji { display: inline; }
body.shift .asWord { display: none; }
body.shift a.kanji { text-decoration: underline dotted var(--accent) 1px; text-underline-offset: .18em; }
.done-en { color: var(--dim); margin-top: 6px; }
/* Hidden, not removed: revealing the text must not move anything. */
.listen .hero.sentence, .listen .answer { visibility: hidden; }
.listen.showText .hero.sentence, .listen.showTrans .answer { visibility: visible; }
.empty { color: var(--dim); }
rt { -webkit-user-select: none; user-select: none; }   /* selecting a sentence for Speech or copy skips the furigana */
</style>
</head>
<body>
<header>
  <span id="label"></span>
  <span><span id="skipped"></span><a id="count" href="#week" title="This week's list"></a></span>
</header>
<div id="app"></div>
<footer>
  <button id="listenBtn">listen</button>
  <button id="zenBtn">zen</button>
  <button id="themeBtn">theme</button>
  <button id="strokeBtn">strokes</button>
  <button id="speedBtn"></button>
  <button id="fontBtn"></button>
  <button id="voiceBtn">voice</button>
  <button id="speakerBtn" title="AivisSpeech voice (v)" hidden></button>
  <button id="speedBtnTts" title="Speech speed (- slower, = faster, click to reset)"></button>
  <button id="askBtn" class="touchOnly" title="Explain the selection or sentence (Google AI Mode)">explain</button>
  <button id="syncBtn" title="Sync to GitHub (y; Y for settings)">sync</button>
</footer>
<div id="explain" hidden></div>

<script id="words" type="application/json">/*WORDS*/[]</script>
<script>
"use strict";
const WEEK_SIZE = 100, STORE_KEY = "vocab-drill.v1";
const STAGES = [
  { kind: "id", furigana: true, context: true, label: "Recognition · furigana · in context" },
  { kind: "id", furigana: false, context: true, label: "Recognition · in context" },
  { kind: "id", furigana: true, context: false, label: "Recognition · furigana" },
  { kind: "id", furigana: false, context: false, label: "Recognition" },
  { kind: "choice", label: "Production · choose" },
  { kind: "type", label: "Production · type" },
];

/* ---------- data ---------- */
const WORDS = JSON.parse(document.getElementById("words").textContent).map(
  ([expr, reading, gloss, capsule, level, rank, slug]) => {
    const forms = expr.split(/[;；]/).map(s => s.trim()).filter(Boolean);
    const readings = reading.split(/[;；]/).map(s => s.trim()).filter(Boolean);
    return { id: forms[0] + "|" + readings[0], forms, readings, word: forms[0], kana: readings[0], sound: readings[0].replace(/\s*[(（][^)）]*[)）]/g, "").replace(/[～~]/g, "").trim(), gloss, capsule, level, rank, slug };
  });
const BY_ID = new Map(WORDS.map(w => [w.id, w]));

/* ---------- storage ---------- */
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
const DEFAULTS = { status: {}, results: {}, week: null, day: null, last: null, plain: false, theme: null, strokes: false, strokeSpeed: "quick", font: "animation", history: [], voice: false, log: {}, weeks: [] };
const S = Object.assign(structuredClone(DEFAULTS), loadState());
/* Older saves kept only the previous week's words, without its date. */
if (S.prev && S.prev.length && !S.weeks.length && S.week) {
  const start = new Date(S.week.start + "T12:00");
  start.setDate(start.getDate() - 7);
  S.weeks.push({ start: iso(start), ids: S.prev });
}
delete S.prev;
/* Answers from before the activity log all fall on the first day of the first week. */
if (!S.logBackfilled && S.week) {
  const review = S.day ? S.day.cleared.length + S.day.missed.length : 0;
  const answers = Object.keys(S.status).length + review;
  S.log[S.week.start] = Math.max(S.log[S.week.start] || 0, answers);
  S.logBackfilled = true;
}
/* Weeks saved before the skipped counter existed: only the first week can be mid-diagnostic. */
if (S.week && !S.week.ready && S.week.skipped === undefined) {
  S.week.skipped = Object.values(S.status).filter(v => v === "s").length;
}
function save() {
  S.savedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
  scheduleSync();
}
/* GitHub sync settings: their own key, so the token is never part of the synced state. */
const SYNC_KEY = "vocab-drill.sync";
let syncCfg = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)); } catch { return null; } })();
let syncTimer = null, syncing = null;

/* ---------- dates (local time) ---------- */
function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/* Days turn over at 5am, so a late-night session still counts toward the day it began. */
const DAY_STARTS_AT = 5;
function drillNow() {
  const d = new Date();
  d.setHours(d.getHours() - DAY_STARTS_AT);
  return d;
}
function currentDay() {
  return iso(drillNow());
}
function daysBetween(from, to) {
  return Math.round((new Date(to + "T12:00") - new Date(from + "T12:00")) / 864e5);
}

/* ---------- helpers ---------- */
const app = document.getElementById("app");
function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node[k] = v;
  });
  node.append(...kids.flat().filter(k => k !== null && k !== undefined));
  return node;
}
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const isKana = s => /^[぀-ヿ～~ー]+$/.test(s);
function ruby(base, rt) {
  return el("ruby", null, base, el("rt", null, rt));
}
/* Attach the reading to the kanji only: 会う/あう → 会(あ)う. */
function withFurigana(word, kana, wrap = text => text) {
  if (isKana(word)) return [word];
  const parts = word.match(/[぀-ゟ～~]+|[^぀-ゟ～~]+/g);
  const escape = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const rx = new RegExp("^" + parts.map(p => /^[぀-ゟ～~]/.test(p) ? escape(p) : "(.+?)").join("") + "$");
  const match = kana.match(rx);
  if (!match) return [ruby(wrap(word), kana)];
  let group = 1;
  return parts.map(p => /^[぀-ゟ～~]/.test(p) ? p : ruby(wrap(p), match[group++]));
}
/* ---------- Jisho links ---------- */
const hasKanji = s => /[\u3400-\u9fff\uf900-\ufaff]/.test(s);
const jisho = query => "https://jisho.org/search/" + encodeURIComponent(query);
const wordUrl = w => w.slug
  ? "https://jisho.org/word/" + encodeURIComponent(w.slug)
  : jisho(w.word.replace(/[～~]/g, ""));
const kanjiUrl = text => jisho([...text].filter(hasKanji).join("") + " #kanji");
function look(cls, href, ...kids) {
  return el("a", { class: cls, href, target: "_blank", rel: "noopener" }, ...kids);
}
function linkKanji(text) {
  return [...text].map(c => hasKanji(c) ? look("kanji", kanjiUrl(c), c) : c);
}
/* The whole word as one link; holding shift swaps in one link per kanji. */
function linkedWord(w, furigana) {
  const build = wrap => furigana ? withFurigana(w.word, w.sound, wrap) : wrap(w.word);
  return [
    look("look asWord", wordUrl(w), build(text => text)),
    el("span", { class: "asKanji" }, build(linkKanji)),
  ];
}
function heroClass(word) {
  return "hero" + (word.length > 5 ? " long" : "");
}

/* ---------- example sentences (sentences.js, built by tools/) ---------- */
/* Loaded separately because it is many times the size of the app. */
const sentencesReady = new Promise(resolve => {

  const day = new Date(first.getFullYear(), first.getMonth(), first.getDate() - first.getDay(), 12);

/* ---------- listening review ---------- */
const LISTEN_SIZE = 10;

    .flatMap(id => shuffle(data.w[id] || []).map((ref, pass) => ({ w: BY_ID.get(id), ref, pass })))
    .filter(card => card.w)
    .sort((a, b) => a.pass - b.pass)
    .filter(card => !seen.has(card.ref[0]) && seen.add(card.ref[0]))

      if (e.key === "ArrowRight" || (e.key === " " && !finished)) nextListen();

      else if (e.key === "Escape") leave();
      else return false;
    };
    touch = { left: nextListen, right: prevListen };
    if (!finished) aivis(cards[0].s.text);
    return app.append(el("main", null,
      el("div", { class: "hero", lang: "ja" }, finished ? "おわり" : "聞き取り"),
      el("div", { class: "note" }, finished
        ? "→ for " + LISTEN_SIZE + " more · ← back · esc to leave"
        : cards.length + " sentences · → next · ← back · space replays · ↓ text, then translation · ↑ hides"),
      el("div", { class: "actions hotkeys" }, action(finished ? "Again" : "Start", "→", nextListen))));
  }
  const shown = cards[at], { w, s, translated } = shown;   /* shown.text and .trans persist across arrows */
  const answer = el("div", { class: "answer" });
  translated.then(() => answer.append(sentenceEnglish(s)));
  const card = el("main", { class: "listen" },
    el("div", { class: "hero sentence", lang: "ja", onclick: selectSentence }, renderSentence(s, true, w)),
    answer,
    el("div", { class: "actions hotkeys" },
      action("Replay", " ", speak, "space"),
      action("Show", "↓", () => reveal(1)),
      action("Hide", "↑", () => reveal(-1)),
      action("Back", "←", prevListen),
      action("Next", "→", nextListen)),
    el("div", { class: "note" }, (at + 1) + " / " + cards.length));
  const paint = () => {
    card.classList.toggle("showText", !!shown.text);
    card.classList.toggle("showTrans", !!shown.trans);

  /* Three steps: nothing, text, text and translation. ↓ goes one further, ↑ one back. */
  const reveal = by => {

  lookup = w;
  spokenSentence = s.text;
  keys = e => {
    if (e.key === "ArrowRight") nextListen();
    else if (e.key === "ArrowLeft") prevListen();
    else if (e.key === " ") speak();
    else if (e.key === "ArrowDown") reveal(1);
    else if (e.key === "ArrowUp") reveal(-1);
    else if (e.key === "Escape") leave();
    else return false;
  };
  touch = { left: nextListen, right: prevListen, down: () => reveal(1), up: () => reveal(-1) };
  app.append(card);
  say(s.text);
  if (cards[at + 1]) aivis(cards[at + 1].s.text);   /* ready before → is pressed */
}

/* ---------- grammar explainer ---------- */
const plainJa = node => {      /* text without furigana */
  const copy = node.cloneNode(true);
  copy.querySelectorAll("rt, rp").forEach(n => n.remove());
  return copy.textContent;
};
/* The selection, as offsets into its sentence's plain text. With no selection, the whole sentence. */
function explainTarget() {
  const sel = getSelection();
  const node = sel.rangeCount ? sel.getRangeAt(0).commonAncestorContainer : null;
  const box = node && (node.nodeType === 1 ? node : node.parentElement).closest(".asWord, .asKanji");
  if (box) {
    const range = sel.getRangeAt(0), before = document.createRange();
    before.setStart(box, 0);
    before.setEnd(range.startContainer, range.startOffset);
    const sentence = plainJa(box);
    const start = plainJa(before.cloneContents()), picked = plainJa(range.cloneContents()).trim();
    if (picked && picked !== sentence.trim()) return { sentence, start: start.length, end: start.length + picked.length };
    return { sentence };
  }
  return spokenSentence ? { sentence: spokenSentence } : null;
}
/* e: Claude, through tools/explain_server.py (claude -p), in a panel over the footer. */
const EXPLAINER = "http://127.0.0.1:10102/explain";
const explained = new Map();   /* "sentence\u0000start\u0000end" -> explanation */
let explaining = null;         /* AbortController of the request on screen */
function closeExplain() {
  if (explaining) explaining.abort();
  explaining = null;
  document.getElementById("explain").hidden = true;
}
async function explain() {
  const box = document.getElementById("explain");
  if (!box.hidden) return closeExplain();
  const t = explainTarget();
  if (!t) return;
  const part = t.start === undefined ? null : t.sentence.slice(t.start, t.end);
  const out = el("div");
  box.replaceChildren(el("div", { class: "q", lang: "ja" },
    part ? [t.sentence.slice(0, t.start), el("b", null, part), t.sentence.slice(t.end)] : t.sentence), out);
  box.hidden = false;
  const cacheKey = [t.sentence, t.start, t.end].join("\u0000");
  if (explained.has(cacheKey)) return void (out.textContent = explained.get(cacheKey));
  out.textContent = "…";
  const ctl = explaining = new AbortController();
  try {
    const res = await fetch(EXPLAINER, {
      method: "POST", signal: ctl.signal, headers: { "content-type": "application/json" },
      body: JSON.stringify(part ? t : { sentence: t.sentence }),
    }).catch(() => { throw new Error("The explainer isn't running. Start it with: python3 tools/explain_server.py"); });
    if (!res.ok) throw new Error("explainer " + res.status + ": " + await res.text());
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let text = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      out.textContent = text += value;
    }
    if (text) explained.set(cacheKey, text);
    else out.textContent = "(no answer)";
  } catch (err) {
    if (ctl.signal.aborted) return;
    out.replaceChildren(el("span", { class: "err" }, String(err.message || err)));
  } finally {
    if (explaining === ctl) explaining = null;
  }
}
/* E: Google AI Mode in a new tab. udm=50 is AI Mode; Google may change it, in which case this lands on ordinary results. */
function explainGoogle() {
  const t = explainTarget();
  if (!t) return;
  const part = t.start === undefined ? null : t.sentence.slice(t.start, t.end);
  const ask = part
    ? "Concisely explain in English 「" + part + "」 in this Japanese sentence (pattern, reading, meaning here): " +
      t.sentence.slice(0, t.start) + "<<" + part + ">>" + t.sentence.slice(t.end)
    : "Concisely explain in English the grammar of this Japanese sentence: " + t.sentence;

/* ---------- touch ---------- */
/* Swipes and taps call the view's `touch` handlers, the way keys call `keys`.
   Touch events, not pointer events, so a vertical scroll never cancels the gesture. */
const SWIPE_MIN = 50, SWIPE_MS = 700, EDGE = 24;
let lastPointer = "mouse", swipe = null;
addEventListener("pointerdown", e => { lastPointer = e.pointerType; }, { capture: true, passive: true });
const swipeCard = () => app.querySelector("main");
function dropSwipe(settle) {
  const card = swipe && swipe.card;
  swipe = null;
  if (!card || !card.isConnected) return;
  card.classList.remove("dragging");
  if (settle) card.classList.add("settling");
  card.style.transform = card.style.opacity = "";
}
app.addEventListener("touchstart", e => {
  dropSwipe(false);
  const t = e.touches[0];
  if (e.touches.length !== 1 || !touch) return;
  if (t.clientX < EDGE || t.clientX > innerWidth - EDGE) return;   /* the browser's own back/forward swipes */
  if (e.target.closest("input, .scroller")) return;                /* typing, and the heatmap's sideways scroll */
  swipe = { x: t.clientX, y: t.clientY, at: Date.now(), scroll: scrollY, card: swipeCard() };
}, { passive: true });
app.addEventListener("touchmove", e => {
  if (!swipe || !swipe.card) return;
  const t = e.touches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  /* The card follows the finger only toward a side that does something. */
  if (Math.abs(dx) > Math.abs(dy) && touch && touch[dx > 0 ? "right" : "left"]) {
    swipe.card.classList.remove("settling");
    swipe.card.classList.add("dragging");
    swipe.card.style.transform = "translateX(" + dx * 0.5 + "px)";
    swipe.card.style.opacity = Math.max(0.4, 1 - Math.abs(dx) / 500);
  } else if (swipe.card.style.transform) {
    swipe.card.style.transform = swipe.card.style.opacity = "";
  }
}, { passive: true });
app.addEventListener("touchend", e => {
  if (!swipe) return;
  const t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  const quick = Date.now() - swipe.at < SWIPE_MS, still = scrollY === swipe.scroll;
  let dir = null;
  if (Math.abs(dx) >= SWIPE_MIN && Math.abs(dx) > 1.5 * Math.abs(dy)) dir = dx > 0 ? "right" : "left";
  else if (still && Math.abs(dy) >= SWIPE_MIN && Math.abs(dy) > 1.5 * Math.abs(dx)) dir = dy > 0 ? "down" : "up";
  const handler = quick && dir && touch && touch[dir];
  dropSwipe(!handler);
  if (handler) handler();
}, { passive: true });
app.addEventListener("touchcancel", () => dropSwipe(true), { passive: true });
/* A tap anywhere on an unrevealed card reveals it, instead of following the word's Jisho link.
   Where the view offers touch.word, a tap on the key word itself does that instead. */
app.addEventListener("click", e => {
  if (lastPointer !== "touch" || !touch || !touch.tap) return;
  if (!e.target.closest("main") || e.target.closest("button, input")) return;
  e.preventDefault();
  e.stopPropagation();
  if (touch.word && e.target.closest(".hero.sentence mark, .hero:not(.sentence)")) touch.word();
  else touch.tap();
}, true);

/* ---------- GitHub sync ---------- */
/* The whole state is one JSON file in a (private) GitHub repo. Each push is a commit through the
   contents API, so the repo's history is a backup. Pull on open and on return to the tab; push a
   little after the last answer, and when the tab is hidden. */
const SYNC_DELAY = 20000;
const isDirty = () => !syncCfg.syncedAt || (S.savedAt || 0) > syncCfg.syncedAt;
const saveSyncCfg = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); } catch {} };
function syncStatus(state, detail) {
  const button = document.getElementById("syncBtn");
  button.textContent = { off: "sync", pending: "sync •", busy: "sync …", ok: "synced", err: "sync !" }[state];
  button.classList.toggle("err", state === "err");
  button.title = detail || "Sync to GitHub (y; Y for settings)";
}
function scheduleSync() {
  if (!syncCfg) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, SYNC_DELAY);
  if (!syncing) syncStatus("pending");
}
function deviceName() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
  return (ua.match(/iPhone|Android|Macintosh|Windows|Linux/) || ["browser"])[0].replace("Macintosh", "Mac");
}
function toBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const fromBase64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
async function github(method, body, accept) {
  const path = syncCfg.path.split("/").map(encodeURIComponent).join("/");
  const res = await fetch("https://api.github.com/repos/" + syncCfg.repo + "/contents/" + path, {
    method, cache: "no-store", body: body && JSON.stringify(body),
    headers: { authorization: "Bearer " + syncCfg.token, accept: accept || "application/vnd.github+json" },
  });
  if (res.ok || (method === "GET" && res.status === 404) || (method === "PUT" && (res.status === 409 || res.status === 422))) return res;
  let message = "";
  try { message = (await res.json()).message; } catch {}
  throw new Error("GitHub " + res.status + (message ? ": " + message : ""));
}
async function fetchRemote() {
  const res = await github("GET");
  if (res.status === 404) return null;
  const meta = await res.json();
  /* Files over 1 MB come without their content inlined. */
  const text = meta.content ? fromBase64(meta.content) : await (await github("GET", null, "application/vnd.github.raw+json")).text();
  return { sha: meta.sha, data: JSON.parse(text) };
}
async function pushState() {
  const pushedAt = S.savedAt || Date.now();
  const body = { message: "sync from " + deviceName(), content: toBase64(JSON.stringify(S, null, 1) + "\n") };
  if (syncCfg.sha) body.sha = syncCfg.sha;
  const res = await github("PUT", body);
  if (!res.ok) return false;   /* someone else committed first */
  syncCfg.sha = (await res.json()).content.sha;
  syncCfg.syncedAt = pushedAt;
  saveSyncCfg();
  return true;
}
/* Both devices answered since the last sync: keep every answer from both. */
function mergeStates(a, b) {
  const [older, newer] = (a.savedAt || 0) > (b.savedAt || 0) ? [b, a] : [a, b];
  const m = { ...older, ...newer };   /* settings, history and the rest: the newer device's */
  m.status = { ...older.status, ...newer.status };
  m.results = { ...older.results };
  for (const [id, r] of Object.entries(newer.results || {}))
    if (!m.results[id] || r.total >= m.results[id].total) m.results[id] = r;
  m.log = { ...older.log };
  for (const [day, n] of Object.entries(newer.log || {})) m.log[day] = Math.max(m.log[day] || 0, n);
  const byStart = (x, y) => x.start < y.start ? -1 : x.start > y.start ? 1 : 0;
  const weekProgress = w => (w.ready ? 1e6 : 0) + w.ids.length + (w.skipped || 0);
  const weeks = [older.week, newer.week].filter(Boolean);
  m.week = weeks.length === 2 && weeks[0].start === weeks[1].start
    ? (weekProgress(weeks[0]) > weekProgress(weeks[1]) ? weeks[0] : weeks[1])
    : weeks.sort(byStart).pop() || null;
  const past = new Map();
  for (const w of [...(older.weeks || []), ...(newer.weeks || []), ...weeks])
    if (w && w.ids.length && (!m.week || w.start !== m.week.start)) past.set(w.start, { start: w.start, ids: w.ids });
  m.weeks = [...past.values()].sort(byStart);
  const dayProgress = d => d.round * 1e6 + d.cleared.length + d.missed.length;
  const days = [older.day, newer.day].filter(Boolean);
  m.day = days.length === 2 && days[0].date === days[1].date
    ? (dayProgress(days[0]) > dayProgress(days[1]) ? days[0] : days[1])
    : days.sort((x, y) => x.date < y.date ? -1 : 1).pop() || null;
  return m;
}
/* Replace the state in place (S is const) and redraw. */
function adopt(data, changed) {
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, structuredClone(DEFAULTS), data);
  if (changed) S.savedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
  paintChrome();
  render();
}
/* Pull, merge if both sides changed, push if this side has news. Callable from JS: vocabSync.now(). */
function syncNow() {
  if (!syncCfg) return setupSync();
  clearTimeout(syncTimer);
  if (syncing) return syncing;
  syncStatus("busy");
  syncing = (async () => {
    for (let attempt = 0; attempt < 3; attempt++) {
      const remote = await fetchRemote();
      if (!remote) syncCfg.sha = null;
      else if (remote.sha !== syncCfg.sha) {
        const mine = isDirty() && Object.keys(S.status).length > 0;
        adopt(mine ? mergeStates(S, remote.data) : remote.data, mine);
        syncCfg.sha = remote.sha;
        if (!mine) syncCfg.syncedAt = S.savedAt || 1;
        saveSyncCfg();
      }
      if (!isDirty() || await pushState()) return;
    }
    throw new Error("GitHub kept changing underneath; try again");
  })();
  return syncing.then(() => {
    syncing = null;
    syncStatus("ok", "Synced with " + syncCfg.repo + " at " + new Date().toLocaleTimeString() + " (y; Y for settings)");
    if (isDirty()) scheduleSync();   /* answered while it was syncing */
  }, err => {
    syncing = null;
    syncStatus("err", String(err.message || err) + " — tap to retry or change settings");
    console.warn("sync:", err);

}
function setupSync() {
  const repo = prompt("Sync to GitHub: repository as owner/name (make it private). Leave empty to turn sync off.", syncCfg ? syncCfg.repo : "");
  if (repo === null) return;

    (syncCfg ? " Leave empty to keep the current one." : ""), "");
  if (token === null || (!token.trim() && !syncCfg)) return;
  const path = prompt("File in the repo", syncCfg ? syncCfg.path : "vocab-drill.json");
  if (path === null) return;
  const same = syncCfg && syncCfg.repo === repo.trim() && syncCfg.path === (path.trim() || "vocab-drill.json");
  syncCfg = {
    repo: repo.trim(), path: path.trim() || "vocab-drill.json",
    token: token.trim() || syncCfg.token,
    sha: same ? syncCfg.sha : null, syncedAt: same ? syncCfg.syncedAt : 0,
  };

}
function clickSync() {
  if (document.getElementById("syncBtn").classList.contains("err")
      && confirm(document.getElementById("syncBtn").title.replace(/ — .*$/, "") + "\n\nChange sync settings? (Cancel retries.)")) return setupSync();
  syncNow();
}
window.vocabSync = { now: syncNow, setup: setupSync, get state() { return S; } };

function paintChrome() {

  applyFont();
  paintSpeed();
  paintSpeaker();
  document.getElementById("strokeBtn").classList.toggle("on", S.strokes);

}
const openListen = () => { location.hash = "#listen"; };
document.getElementById("listenBtn").addEventListener("click", openListen);
document.getElementById("strokeBtn").addEventListener("click", toggleStrokes);
document.getElementById("voiceBtn").addEventListener("click", toggleVoice);

const holdShift = held => document.body.classList.toggle("shift", held);

addEventListener("blur", () => holdShift(false));
document.addEventListener("keydown", e => {
  if (e.key === "Shift") holdShift(true);
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = e.target.tagName === "INPUT";
  if (e.key === "Escape" && !document.getElementById("explain").hidden) { e.preventDefault(); return closeExplain(); }
  if ((e.key === "e" || e.key === "E") && (!typing || e.target.readOnly)) {
    e.preventDefault();

  }
  if (keys && (!typing || e.target.readOnly) && keys(e) !== false) { e.preventDefault(); return; }
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !location.hash
      && (!typing || e.target.readOnly || !e.target.value)) {
    e.preventDefault();

  if (typing && !e.target.readOnly) return;

  else if (e.key === "L" && lookup) window.open(hasKanji(lookup.word) ? kanjiUrl(lookup.word) : wordUrl(lookup), "_blank", "noopener");
  else if (e.key === "s" && strokeHero) drawWord(strokeHero, true);

addEventListener("hashchange", () => { viewedWeek = null; listening = null; render(); });

if (syncCfg) syncNow();
